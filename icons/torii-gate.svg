<!-- Torii Gate - Section Divider / Decorative Element -->
<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Torii gate body -->
  <rect x="35" y="20" width="10" height="140" rx="2" fill="#e74c3c" opacity="0.5"/>
  <rect x="155" y="20" width="10" height="140" rx="2" fill="#e74c3c" opacity="0.5"/>

  <!-- Top beam (kasagi) - curved -->
  <path d="M20 18 Q100 12 180 18 L180 26 Q100 20 20 26 Z" fill="#e74c3c" opacity="0.5"/>

  <!-- Second beam (shinagi) -->
  <rect x="30" y="42" width="140" height="7" rx="2" fill="#e74c3c" opacity="0.45"/>

  <!-- Center tie (gakuzuka) -->
  <rect x="38" y="30" width="124" height="5" rx="1" fill="#e74c3c" opacity="0.35"/>

  <!-- Base stones -->
  <rect x="30" y="152" width="20" height="8" rx="2" fill="#e74c3c" opacity="0.4"/>
  <rect x="150" y="152" width="20" height="8" rx="2" fill="#e74c3c" opacity="0.4"/>

  <!-- Ground line -->
  <line x1="20" y1="160" x2="180" y2="160" stroke="#e74c3c" stroke-width="1.5" opacity="0.2"/>

  <!-- Decorative clouds -->
  <ellipse cx="50" cy="12" rx="18" ry="6" fill="#e74c3c" opacity="0.1"/>
  <ellipse cx="150" cy="8" rx="22" ry="7" fill="#e74c3c" opacity="0.1"/>
</svg>
