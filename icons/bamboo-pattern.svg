<!-- Bamboo Forest Pattern - For Arashiyama / Nature sections -->
<svg viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bamboo stalks -->
  <rect x="30" y="0" width="8" height="300" rx="4" fill="#66bb6a" opacity="0.12"/>
  <rect x="30" y="50" width="8" height="12" rx="4" fill="#4caf50" opacity="0.1"/>
  <rect x="30" y="120" width="8" height="12" rx="4" fill="#4caf50" opacity="0.1"/>
  <rect x="30" y="200" width="8" height="12" rx="4" fill="#4caf50" opacity="0.1"/>

  <rect x="70" y="0" width="6" height="300" rx="3" fill="#81c784" opacity="0.1"/>
  <rect x="70" y="80" width="6" height="10" rx="3" fill="#66bb6a" opacity="0.08"/>
  <rect x="70" y="160" width="6" height="10" rx="3" fill="#66bb6a" opacity="0.08"/>
