<!-- Japanese Shrine / Temple Icon - For sightseeing events -->
<svg viewBox="0 0 80 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Roof top -->
  <path d="M15 35 L40 8 L65 35" stroke="#e74c3c" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M12 35 L40 10 L68 35" stroke="#c0392b" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- Roof curve -->
  <path d="M10 35 Q40 28 70 35" stroke="#e74c3c" stroke-width="2.5" fill="none" opacity="0.4"/>

  <!-- Second roof -->
  <path d="M20 45 L40 28 L60 45" stroke="#e74c3c" stroke-width="2" fill="none" opacity="0.35"/>

  <!-- Building body -->
  <rect x="25" y="45" width="30" height="35" rx="1" fill="#e74c3c" opacity="0.15"/>

  <!-- Door -->
  <rect x="34" y="58" width="12" height="22" rx="6" fill="#e74c3c" opacity="0.25"/>

  <!-- Pillars -->
  <rect x="27" y="45" width="3" height="35" fill="#e74c3c" opacity="0.2"/>
  <rect x="50" y="45" width="3" height="35" fill="#e74c3c" opacity="0.2"/>

  <!-- Base -->
  <rect x="20" y="80" width="40" height="5" rx="1" fill="#e74c3c" opacity="0.2"/>

  <!-- Steps -->
  <rect x="28" y="85" width="24" height="3" rx="1" fill="#e74c3c" opacity="0.15"/>
  <rect x="24" y="89" width="32" height="3" rx="1" fill="#e74c3c" opacity="0.1"/>

  <!-- Lantern left -->
  <rect x="14" y="50" width="6" height="8" rx="3" fill="#e74c3c" opacity="0.2"/>
  <line x1="17" y1="45" x2="17" y2="50" stroke="#e74c3c" stroke-width="1.5" opacity="0.2"/>

  <!-- Lantern right -->
  <rect x="60" y="50" width="6" height="8" rx="3" fill="#e74c3c" opacity="0.2"/>
  <line x1="63" y1="45" x2="63" y2="50" stroke="#e74c3c" stroke-width="1.5" opacity="0.2"/>
</svg>
