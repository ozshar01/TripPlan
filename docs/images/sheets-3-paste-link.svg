<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="320" height="200" rx="18" fill="#f6f1e8"/>

  <!-- phone -->
  <g transform="translate(100,14)">
    <rect x="0" y="0" width="120" height="172" rx="18" fill="#ffffff" stroke="#29304f" stroke-width="3"/>
    <rect x="10" y="14" width="100" height="18" rx="4" fill="#4a5684"/>
    <!-- gear icon for settings tab -->
    <g transform="translate(60,32)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
      <circle r="6"/>
      <line x1="0" y1="-10" x2="0" y2="-7"/>
      <line x1="0" y1="10" x2="0" y2="7"/>
      <line x1="-10" y1="0" x2="-7" y2="0"/>
      <line x1="10" y1="0" x2="7" y2="0"/>
      <line x1="-7" y1="-7" x2="-5" y2="-5"/>
      <line x1="7" y1="7" x2="5" y2="5"/>
      <line x1="-7" y1="7" x2="-5" y2="5"/>
      <line x1="7" y1="-7" x2="5" y2="-5"/>
    </g>
    <!-- input field with link -->
    <rect x="10" y="60" width="100" height="22" rx="6" fill="#f6f1e8" stroke="#4a5684" stroke-width="1.6"/>
    <path d="M22,71 h14 M32,71 a5,5 0 0 0 0,-10 h-5 M32,71 a5,5 0 0 1 0,10 h-5" fill="none" stroke="#4a5684" stroke-width="2" stroke-linecap="round"/>
    <line x1="46" y1="71" x2="98" y2="71" stroke="#4a5684" stroke-width="1.6" stroke-dasharray="3,3"/>
    <!-- sync button -->
    <rect x="10" y="94" width="100" height="24" rx="8" fill="#5a9e78"/>
  </g>

  <!-- cursor / paste hint -->
  <g transform="translate(60,80)" stroke="#e74c3c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="0" x2="40" y2="0"/>
    <path d="M28,-12 L44,0 L28,12"/>
  </g>
</svg>
